id: "gensoumarket-v1.1-test"
title: "GensouMarket v1.1 人工测试计划"
project: "GensouMarket"
mcVersion: "1.20+"
loader: "Paper"
modVersion: "v1.1"

cases:
  - id: "t-base-startup-and-menu"
    title: "插件启动与主菜单"
    priority: "high"
    category: "基础冒烟"
    side: "server"
    steps:
      - "启动服务端，确认插件正常加载"
      - "执行 /gmarket help 确认主命令可用"
      - "执行 /gmarket 打开主菜单"
    expected:
      - "插件成功启用，无明显启动异常"
      - "主命令可用"
      - "主菜单正常打开，已启用模块显示入口，已关闭模块不显示入口"
    commands:
      - "/gmarket help"
      - "/gmarket"
    tags: ["基础", "冒烟"]

  - id: "t-per-shop-view"
    title: "个人商店视图功能"
    priority: "high"
    category: "个人商店"
    side: "server"
    steps:
      - "seller 在全球市场上架至少 1 个物品"
      - "seller 执行 /gmarket personal 查看自己的商店"
      - "buyer 执行 /gmarket personal seller 查看 seller 的商店"
      - "确保 seller 当前没有有效上架，buyer 再次执行 /gmarket personal seller"
      - "buyer 从 seller 的个人商店购买物品"
    expected:
      - "seller 成功打开个人商店界面，只显示自己的有效上架"
      - "buyer 成功打开 seller 的个人商店，页面内容与卖家当前有效上架一致"
      - "无货时不报错，正常提示该玩家当前没有在售物品"
      - "购买流程正常，复用现有市场购买逻辑，商品状态变化正确"
    commands:
      - "/gmarket personal"
      - "/gmarket personal seller"
    tags: ["个人商店", "视图"]

  - id: "t-per-shop-sign-create-and-open"
    title: "个人商店牌子创建与打开"
    priority: "high"
    category: "个人商店牌子"
    side: "server"
    steps:
      - "seller 拥有 gensoumarket.personal.sign.create 权限，放置牌子，第一行写 [个人商店]"
      - "seller 放置另一个牌子，第一行写 [gmarketshop] 测试别名语法"
      - "移除测试玩家创建权限，尝试创建牌子"
      - "buyer 右键 seller 的个人商店牌子"
    expected:
      - "牌子创建成功，牌面被插件改写为统一格式，personal-shop-signs.yml 写入对应记录"
      - "别名语法同样能成功创建，牌面仍被统一改写"
      - "无权限时创建被阻止，不会写入绑定记录"
      - "buyer 右键牌子正常打开 seller 的个人商店，不进入普通牌子编辑逻辑"
    commands: []
    tags: ["个人商店", "牌子", "创建"]

  - id: "t-per-shop-sign-protection"
    title: "个人商店牌子保护机制"
    priority: "high"
    category: "个人商店牌子"
    side: "server"
    steps:
      - "buyer 尝试破坏 seller 的牌子"
      - "seller 或 admin 破坏该牌子"
      - "分别创建立式牌子、墙牌、悬挂牌、墙挂牌，使用非店主玩家尝试破坏其真实支撑方块"
      - "在牌子附近制造爆炸，覆盖牌子本体与支撑方块场景"
      - "用活塞尝试推动牌子本体或其支撑方块"
      - "在有区域保护的地方尝试创建个人商店牌子，确保 SignChangeEvent 被外部插件取消，检查 personal-shop-signs.yml"
    expected:
      - "非店主破坏被取消，收到无权破坏提示"
      - "店主或管理员允许破坏，对应绑定记录被删除"
      - "真实支撑方块也被保护，不能通过打支撑块绕过保护"
      - "牌子本体和支撑方块不会被爆炸破坏"
      - "相关推动被阻止，牌子与支撑方块不会被活塞破坏或挪位"
      - "被取消的创建不会生成牌子绑定记录，不会出现脏数据"
    commands: []
    tags: ["个人商店", "牌子", "保护"]

  - id: "t-per-shop-sign-module-disabled"
    title: "个人商店关闭时牌子行为"
    priority: "medium"
    category: "个人商店牌子"
    side: "server"
    steps:
      - "创建好个人商店牌子"
      - "把 personal-shop.enabled 改为 false"
      - "执行 /gmarket reload"
      - "右键该牌子"
    expected:
      - "不再作为可用入口打开个人商店界面"
      - "会提示个人商店功能未启用"
      - "牌子本身仍受保护"
    commands:
      - "/gmarket reload"
    tags: ["个人商店", "牌子", "模块开关"]

  - id: "t-module-switch-market-auction-personal"
    title: "市场、拍卖、个人商店模块开关"
    priority: "high"
    category: "模块开关"
    side: "server"
    steps:
      - "设置 market.enabled=false，执行 /gmarket reload，测试 /gmarket sell、/gmarket buy、/gmarket search 和主菜单入口"
      - "设置 auction.enabled=false，执行 /gmarket reload，测试 /gmarket auction、/gmarket bid 和主菜单入口"
      - "设置 personal-shop.enabled=false，执行 /gmarket reload，测试 /gmarket personal、主菜单入口、旧牌子右键"
    expected:
      - "market.enabled=false 时，相关命令被阻止并提示未启用，主菜单不再显示市场入口"
      - "auction.enabled=false 时，相关命令被阻止并提示未启用，主菜单不再显示拍卖入口"
      - "personal-shop.enabled=false 时，指令不可主动使用，主菜单不显示个人商店入口，旧牌子不再打开界面但仍受保护"
    commands:
      - "/gmarket reload"
      - "/gmarket sell"
      - "/gmarket buy"
      - "/gmarket search"
      - "/gmarket auction"
      - "/gmarket bid"
      - "/gmarket personal"
    tags: ["模块开关", "重载"]

  - id: "t-module-auction-hot-reload"
    title: "拍卖模块热重载"
    priority: "medium"
    category: "模块开关"
    side: "server"
    steps:
      - "创建一个未结束的拍卖"
      - "把 auction.enabled 从 true 改成 false，执行 /gmarket reload"
      - "再改回 true，再次执行 /gmarket reload"
    expected:
      - "true -> false 时，精确定时任务被取消"
      - "false -> true 时，活跃拍卖定时任务被恢复"
      - "不会出现重复结束或重复任务"
    commands:
      - "/gmarket reload"
    tags: ["模块开关", "拍卖", "热重载"]

  - id: "t-module-mail-disabled-collect"
    title: "邮件模块关闭时仍允许领取"
    priority: "medium"
    category: "模块开关"
    side: "server"
    steps:
      - "设置 mail.enabled=false，执行 /gmarket reload"
      - "构造一封待领取邮件（例如背包满或离线补发）"
      - "执行 /gmarket collect"
    expected:
      - "/gmarket collect 仍可正常使用"
      - "待领取资产不会变成死信"
    commands:
      - "/gmarket reload"
      - "/gmarket collect"
    tags: ["模块开关", "邮件"]

  - id: "t-shop-fixed-unlimited"
    title: "固定售价+无限库存商品"
    priority: "high"
    category: "商店双模式"
    side: "server"
    steps:
      - "在 shop.yml 配置 diamond: mode=fixed, stock-mode=unlimited, buy-price=1000.0"
      - "执行 /gmarket reload"
      - "打开服务器商店，购买 diamond，重复购买多次"
    expected:
      - "购买正常"
      - "不会出现库存减少"
      - "物品说明显示为无限库存"
    commands:
      - "/gmarket reload"
    tags: ["商店", "固定售价", "无限库存"]

  - id: "t-shop-fixed-limited"
    title: "固定售价+有限库存商品"
    priority: "high"
    category: "商店双模式"
    side: "server"
    steps:
      - "在 shop.yml 配置 stone_limited: mode=fixed, stock-mode=limited, buy-price=12.0, initial-stock=8"
      - "执行 /gmarket reload，打开商店查看该商品"
      - "连续购买 stone_limited"
      - "将 stone_limited 买到 0，再次购买"
    expected:
      - "物品说明显示有限库存，初始库存等于 initial-stock"
      - "每次购买后库存正确扣减"
      - "库存为 0 时显示缺货，购买被阻止，不发生扣款，明确提示缺货"
    commands:
      - "/gmarket reload"
    tags: ["商店", "固定售价", "有限库存"]

  - id: "t-shop-setstock-setprice"
    title: "setstock 和 setprice 命令"
    priority: "medium"
    category: "商店双模式"
    side: "server"
    steps:
      - "对 stone_limited 执行 /gmarket shop setstock stone_limited 5"
      - "对 diamond 执行 /gmarket shop setstock diamond 5"
      - "对 dirt_recycled 执行 /gmarket shop setstock dirt_recycled 5"
      - "对 stone_limited 执行 /gmarket shop setprice stone_limited 18，然后 /gmarket reload，再次查看该商品"
    expected:
      - "stone_limited 设置成功"
      - "diamond 被拒绝并提示无限库存不能设置"
      - "dirt_recycled 被拒绝并提示库存来自回收池"
      - "setprice 后价格被更新，仍保持固定售价+有限库存，库存仍从有限库存路径读取，不会被降级成无限库存"
    commands:
      - "/gmarket shop setstock stone_limited 5"
      - "/gmarket shop setstock diamond 5"
      - "/gmarket shop setstock dirt_recycled 5"
      - "/gmarket shop setprice stone_limited 18"
      - "/gmarket reload"
    tags: ["商店", "命令", "库存", "价格"]

  - id: "t-shop-recycled-mode"
    title: "回流出售模式商品"
    priority: "high"
    category: "商店双模式"
    side: "server"
    steps:
      - "在 shop.yml 配置 dirt_recycled: mode=recycled, recycle-source=dirt, sell-multiplier=1.50"
      - "在 recycle.yml 配置 dirt: material=DIRT, recycle-price=2.0"
      - "执行 /gmarket reload，保证 dirt_recycled 对应回流库存为 0，打开商店查看该商品"
      - "seller 背包内准备一批 DIRT，执行回收，打开商店查看 dirt_recycled"
      - "记录 dirt 当前回收价，查看 dirt_recycled 当前售价"
      - "购买 dirt_recycled"
      - "先制造一部分 dirt 回流库存，执行 /gmarket reload，再次查看 dirt_recycled"
      - "先制造一部分 dirt 回流库存，重启服务器，再次查看 dirt_recycled"
    expected:
      - "初始无库存时显示缺货，不可购买"
      - "回收注入回流库存后，dirt 回流库存增加，dirt_recycled 变为可售，物品说明显示回流来源和当前库存"
      - "售价 = 当前回收价 × sell-multiplier，最终金额保留两位小数"
      - "购买成功时回流库存扣减，库存为 0 后重新变成缺货"
      - "重载后回流库存仍存在，不会因为重载被重置成 0"
      - "重启后回流库存仍存在，回流出售模式商品不会错误显示缺货"
    commands:
      - "/gmarket reload"
    tags: ["商店", "回流出售", "回收"]

  - id: "t-cluster-passive-income-and-mail"
    title: "跨服被动收入与邮件落地"
    priority: "high"
    category: "跨服兼容"
    side: "server"
    steps:
      - "配置 A 服：market.enabled=false, auction.enabled=false, mail.enabled=false, personal-shop.enabled=true, cluster.enabled=true"
      - "配置 B 服：market.enabled=true, auction.enabled=true, mail.enabled=true, personal-shop.enabled=true, cluster.enabled=true"
      - "seller 在 B 服完成一次会产生收入的市场或拍卖行为，seller 在线停留在 A 服"
      - "在 B 服构造一笔必须走邮箱的结果（例如背包满或离线补发），让玩家在 A 服上线或保持在线"
    expected:
      - "收入仍能在 A 服落地，玩家仍能收到提示"
      - "A 服仍会收到邮件提醒，mail.enabled=false 时，玩家依然能通过 /gmarket collect 领取"
    commands:
      - "/gmarket collect"
    tags: ["跨服", "被动收入", "邮件"]

  - id: "t-cluster-personal-shop-refresh"
    title: "跨服个人商店刷新"
    priority: "high"
    category: "跨服兼容"
    side: "server"
    steps:
      - "在 A 服：market.enabled=false, personal-shop.enabled=true"
      - "buyer 在 A 服打开 seller 的个人商店"
      - "在 B 服让 seller 的上架发生售出、下架或过期"
    expected:
      - "A 服个人商店页面会刷新"
      - "不依赖 market.enabled=true"
    commands: []
    tags: ["跨服", "个人商店", "刷新"]

  - id: "t-cluster-auction-settlement"
    title: "跨服拍卖结算"
    priority: "high"
    category: "跨服兼容"
    side: "server"
    steps:
      - "A 服关闭拍卖入口"
      - "在 B 服完成一笔拍卖结算"
      - "让相关玩家在线停留在 A 服"
    expected:
      - "拍卖结果仍会在 A 服落地"
      - "金币、物品、提醒不丢"
    commands: []
    tags: ["跨服", "拍卖", "结算"]

  - id: "t-final-build-and-check"
    title: "最终构建与文档外排查"
    priority: "high"
    category: "回归收口"
    side: "server"
    steps:
      - "在项目根目录执行 ./gradlew GensouMarket-plugin:build"
      - "检查最新测试过程中是否出现新的异常日志"
      - "记录任何未归档的边界问题"
    expected:
      - "构建成功"
      - "无新的高优先级回归"
      - "若有问题，能明确归档到新的修复文档"
    commands:
      - "./gradlew GensouMarket-plugin:build"
    tags: ["构建", "回归"]
