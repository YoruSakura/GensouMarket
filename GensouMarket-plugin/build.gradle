plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "8.3.3"
}

group = 'net.scarletphantasy'
version = '1.2'

def targetJavaVersion = 21
def paperBaselineApiVersion = providers.gradleProperty("paperBaselineApiVersion")
        .orElse("1.21-R0.1-SNAPSHOT")
        .get()
def paperLatestApiVersion = providers.gradleProperty("paperLatestApiVersion")
        .orElse("26.1.2.build.65-stable")
        .get()
def paperLatestApiJavaVersion = providers.gradleProperty("paperLatestApiJavaVersion")
        .orElse("25")
        .get()
        .toInteger()
def paperRunMinecraftVersion = providers.gradleProperty("paperRunMinecraftVersion")
        .orElse("1.21")
        .get()
def jetbrainsAnnotationsVersion = "26.0.2"

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
}

configurations {
    paperLatestApiCompileClasspath {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Keep the shipped jar compiled against the oldest supported Paper API.
    compileOnly("io.papermc.paper:paper-api:${paperBaselineApiVersion}")
    compileOnly("org.jetbrains:annotations:${jetbrainsAnnotationsVersion}")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1")
    compileOnly("com.github.Zrips:CMI-API:9.8.6.4") {
        transitive = false
    }
    implementation("com.zaxxer:HikariCP:6.2.1")

    // Optional verification classpath for the latest Paper API line.
    paperLatestApiCompileClasspath("io.papermc.paper:paper-api:${paperLatestApiVersion}")
    paperLatestApiCompileClasspath("org.jetbrains:annotations:${jetbrainsAnnotationsVersion}")
    paperLatestApiCompileClasspath("com.github.MilkBowl:VaultAPI:1.7.1")
    paperLatestApiCompileClasspath("com.github.Zrips:CMI-API:9.8.6.4") {
        transitive = false
    }
    paperLatestApiCompileClasspath("com.zaxxer:HikariCP:6.2.1")
}

tasks {
    runServer {
        minecraftVersion(paperRunMinecraftVersion)
    }

    shadowJar {
        archiveClassifier.set("")
    }

    jar {
        enabled = false
    }

    build {
        dependsOn(shadowJar)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.register("compilePaperLatestApiJava", JavaCompile) {
    group = "verification"
    description = "Compiles the Paper plugin sources against Paper API ${paperLatestApiVersion}."
    source = sourceSets.main.java
    classpath = configurations.paperLatestApiCompileClasspath
    destinationDirectory = layout.buildDirectory.dir("classes/java/paperLatestApi")
    options.encoding = "UTF-8"
    options.release.set(paperLatestApiJavaVersion)
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(paperLatestApiJavaVersion)
    }
}

tasks.register("checkPaperApiCompatibility") {
    group = "verification"
    description = "Checks the plugin against the baseline Paper API and the latest Paper API."
    dependsOn(tasks.named("compileJava"))
    dependsOn(tasks.named("compilePaperLatestApiJava"))
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
