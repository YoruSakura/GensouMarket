# ==============================
# 幻想集市 (GensouMarket) 配置文件
# ==============================

# 数据存储方式: sqlite (默认), mysql (建议), yaml (不推荐)
storage:
  type: sqlite
  # MySQL 配置 (仅当 type 为 mysql 时生效)
  mysql:
    host: localhost
    port: 3306
    database: gensoumarket
    username: root
    password: password

# 全球市场配置
market:
  # 是否启用全球市场入口 (关闭后该子服不再提供市场命令/菜单，但仍接收跨服售出等被动结果)
  enabled: true
  # 上架税率 (0.05 = 5%)
  listing-tax: 0.05
  # 交易税率
  transaction-tax: 0.10
  # 每个玩家最大上架数量
  max-listings: 20
  # 物品过期时间 (小时)
  expire-hours: 168

# 拍卖配置
auction:
  # 是否启用拍卖入口 (关闭后该子服不再提供拍卖命令/菜单，但仍接收跨服拍卖结算等被动结果)
  enabled: true
  # 默认拍卖时长 (分钟)
  default-duration: 60
  # 最短拍卖时长 (分钟)
  min-duration: 10
  # 最长拍卖时长 (分钟)
  max-duration: 1440
  # 拍卖上架手续费比例 (基于起拍价, 0.05 = 5%, 设为0关闭)
  listing-fee-rate: 0.05

# 邮箱配置
mail:
  # 是否在主菜单/帮助/Tab 补全中曝光邮箱入口。
  # 注意：邮箱是底层被动同步能力，/gmarket collect 始终可领取，本开关不影响资产领取与底层邮件写入。
  enabled: true

# 个人商店配置
personal-shop:
  # 是否启用个人商店视图 (按卖家过滤的市场视图)
  enabled: true

# 服务器商店配置（服务器卖给玩家）
shop:
  enabled: true

# 回收站配置（服务器从玩家回收物品）
recycle:
  enabled: true

# 动态价格配置 (仅影响回收价格，商店售卖价格固定)
dynamic-pricing:
  enabled: true
  # 每次出售对回收价格的影响系数
  adjustment-rate: 0.002
  # 回收价格上限倍率 (相对基础回收价格)
  max-multiplier: 3.0
  # 回收价格下限倍率 (相对基础回收价格)
  min-multiplier: 0.1
  # 回收价格恢复速率 (每小时恢复到基准价格的比例)
  recovery-rate: 0.01
  # 市场波动配置 (使回收价格随时间自然波动)
  market-fluctuation:
    # 是否启用市场波动 (独立于供需系统)
    enabled: true
    # 正弦波层 (period=周期小时, amplitude=振幅)
    sine-waves:
      - period: 24
        amplitude: 0.08
      - period: 72
        amplitude: 0.12
      - period: 168
        amplitude: 0.10
    # Perlin Noise 振幅
    noise-amplitude: 0.06
    # Perlin Noise 缩放 (小时)
    noise-scale: 12.0
    # 波动下限
    min-fluctuation: 0.5
    # 波动上限
    max-fluctuation: 1.5
    # 涨跌对比周期 (分钟)
    cycle-minutes: 20

# 面对面交易配置
trade:
  # 是否启用面对面交易
  enabled: true
  # 交易请求超时时间 (秒)
  request-timeout: 30
  # 交易距离限制 (格), 超过此距离交易自动取消
  max-distance: 10
  # 距离检测间隔 (tick, 20 = 1秒)
  distance-check-interval: 20

# 跨服集群配置
cluster:
  # 是否启用跨服模式 (需要 Velocity 代理端插件配合)
  enabled: false
  # 当前服务器 ID (每个子服必须唯一, 例如: survival, creative, skyblock)
  server-id: "default"
  # Plugin Messaging Channel 名称
  channel: "gensoumarket:main"

# 调试模式 (允许购买自己的商品、竞拍自己的拍卖等)
debug: false

# 消息前缀
prefix: "&6[幻想集市] &r"
