# ==============================
# 幻想集市 (GensouMarket) 配置文件
# ==============================

# 数据存储方式: sqlite (默认), mysql (建议), yaml (不推荐)
storage:
  type: sqlite
  # MySQL 配置 (仅当 type 为 mysql 时生效)
  mysql:
    host: localhost
    port: 3306
    database: gensoumarket
    username: root
    password: password

# 全球市场配置
market:
  # 是否启用全球市场入口 (关闭后该子服不再提供市场命令/菜单，但仍接收跨服售出等被动结果)
  enabled: true
  # 上架税率 (0.05 = 5%)
  listing-tax: 0.05
  # 交易税率
  transaction-tax: 0.10
  # 每个玩家最大上架数量
  max-listings: 20
  # 物品过期时间 (小时)
  expire-hours: 168

# 拍卖配置
auction:
  # 是否启用拍卖入口 (关闭后该子服不再提供拍卖命令/菜单，但仍接收跨服拍卖结算等被动结果)
  enabled: true
  # 默认拍卖时长 (分钟)
  default-duration: 60
  # 最短拍卖时长 (分钟)
  min-duration: 10
  # 最长拍卖时长 (分钟)
  max-duration: 1440
  # 拍卖上架手续费比例 (基于起拍价, 0.05 = 5%, 设为0关闭)
  listing-fee-rate: 0.05

# 邮箱配置
mail:
  # 是否在主菜单/帮助/Tab 补全中曝光邮箱入口。
  # 注意：邮箱是底层被动同步能力，/gmarket collect 始终可领取，本开关不影响资产领取与底层邮件写入。
  enabled: true

# 个人商店配置
personal-shop:
  # 是否启用个人商店视图 (按卖家过滤的市场视图)
  enabled: true

# 服务器商店配置（服务器卖给玩家）
shop:
  enabled: true

# 回收站配置（服务器从玩家回收物品）
recycle:
  enabled: true

# 动态价格配置 (v1.1.1: 回收价格 + 服务器商店售价均受影响)
dynamic-pricing:
  enabled: true

  # 回收价格动态调整
  recycle:
    # 回收压力滑动窗口（分钟），窗口内回收量越多价格越低，过期后压力消退
    pressure-window-minutes: 120
    # 压力桶粒度（秒），窗口内按此粒度分桶统计
    bucket-seconds: 60
    # 最低价格触发量（窗口内回收量达到此值时价格降至下限）
    min-price-volume: 4096
    # 回收价格下限倍率（相对 recycle-price）
    min-multiplier: 0.5
    # 回收价格上限倍率（相对 recycle-price）
    max-multiplier: 1.5
    # 周期波动周期（小时）
    cycle-period-hours: 24
    # 周期波动振幅（0.20 = ±20%）
    cycle-amplitude: 0.20

  # 商店售价动态调整
  shop:
    # 售价倍率下限
    min-sell-multiplier: 0.8
    # 售价倍率上限
    max-sell-multiplier: 1.5
    # fixed 模式是否启用动态售价（默认关闭）
    fixed-dynamic-enabled: false
    # recycled 模式是否启用动态售价（默认开启）
    recycled-dynamic-enabled: true
    # 库存对 fixed+limited 售价的影响倍率下限
    min-stock-multiplier: 1.0
    # 库存对 fixed+limited 售价的影响倍率上限
    max-stock-multiplier: 1.5
    # 回流库存目标值（recycled 模式，库存达到此值时售价最低）
    target-recycled-stock: 4096
    # 回流库存充裕时售价倍率下限
    min-recycled-stock-multiplier: 0.85
    # 回流库存稀缺时售价倍率上限
    max-recycled-stock-multiplier: 1.35
    # 反套利倍率（售价 >= 回收价 × 此倍率，防止低买高卖）
    anti-arbitrage-multiplier: 1.15

  # 价格变动确认
  confirmation:
    # 价格变动超过此比例时弹出二次确认（0.05 = 5%）
    price-change-tolerance: 0.05

# 经济平衡阶段配置（根据全服总经济量调节回收/商店倍率）
economy-balance:
  enabled: true
  # 全服余额快照间隔（分钟）
  snapshot-interval-minutes: 10
  # 经济阶段（按 max-total 升序排列，最后一条 max-total: -1 为兜底）
  stages:
    - max-total: 1000000
      recycle-multiplier: 1.15
      shop-multiplier: 0.90
    - max-total: 5000000
      recycle-multiplier: 1.0
      shop-multiplier: 1.0
    - max-total: 10000000
      recycle-multiplier: 0.85
      shop-multiplier: 1.15
    - max-total: -1
      recycle-multiplier: 0.70
      shop-multiplier: 1.35

# 面对面交易配置
trade:
  # 是否启用面对面交易
  enabled: true
  # 交易请求超时时间 (秒)
  request-timeout: 30
  # 交易距离限制 (格), 超过此距离交易自动取消
  max-distance: 10
  # 距离检测间隔 (tick, 20 = 1秒)
  distance-check-interval: 20

# 跨服集群配置
cluster:
  # 是否启用跨服模式 (需要 Velocity 代理端插件配合)
  enabled: false
  # 当前服务器 ID (每个子服必须唯一, 例如: survival, creative, skyblock)
  server-id: "default"
  # Plugin Messaging Channel 名称
  channel: "gensoumarket:main"

# 调试模式 (允许购买自己的商品、竞拍自己的拍卖等)
debug: false

# 消息前缀
prefix: "&6[幻想集市] &r"
